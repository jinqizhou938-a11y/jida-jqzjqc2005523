services:
  - type: web
    name: jida
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ZHIPU_API_KEY
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: ZHIPU_API_URL
        value: https://open.bigmodel.cn/api/paas/v4/chat/completions
      - key: ZHIPU_VISION_MODEL
        value: glm-4v-flash
      - key: WANX_IMAGE_MODEL
        value: wan2.7-image-pro
